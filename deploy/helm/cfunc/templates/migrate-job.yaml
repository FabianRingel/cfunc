{{- if and .Values.migrate.enabled (or .Values.state.dsn .Values.state.dsnSecret.name) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cfunc.fullname" . }}-migrate
  labels: {{- include "cfunc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "cfunc.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "cfunc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - 'cfunc cluster init --dsn "$CFUNC_STATE_DSN"'
          env:
            {{- include "cfunc.dsnEnv" . | nindent 12 }}
{{- end }}
